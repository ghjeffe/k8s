name: Deploy to Kind

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'feature/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      CREATE_CLUSTER: 'false'
      NAMESPACE: pyapp
      CLUSTER_BASE: >
        ${{
          startsWith(github.ref_name, 'feature/') && 'learning' ||
          github.ref_name == 'develop' && 'dev' ||
          startsWith(github.ref_name, 'release/') && 'uat' ||
          github.ref_name == 'main' && 'prod' ||
          'learning'
        }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Determine deployment image tag and cluster
        id: meta
        run: |
          if [ -z "${NAMESPACE}" ]; then
            branch=${GITHUB_REF#refs/heads/}
            echo "Unsupported branch: $branch"
            exit 1
          fi
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          
          #prepend 'kind-' to cluster name; kind clusters get prepended with 'kind-' by k8s
          echo "KIND_CLUSTER=kind-${CLUSTER_BASE}" >> $GITHUB_ENV

          tag=${GITHUB_SHA::7}
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Kind cluster exists
        run: |
          if [ -z "${KIND_CLUSTER}" ]; then
            echo "KIND_CLUSTER not set; defaulting to learning"
            echo "KIND_CLUSTER=kind-learning" >> $GITHUB_ENV
          fi
          # Strip 'kind-' prefix for kind commands (which use cluster names, not context names)
          CLUSTER_NAME=${KIND_CLUSTER#kind-}
          if kind get clusters | grep -q "^${CLUSTER_NAME}$"; then
            echo "Kind cluster ${CLUSTER_NAME} exists"
          else
            if [ "${CREATE_CLUSTER}" = "true" ]; then
              echo "Creating Kind cluster ${CLUSTER_NAME}"
              kind create cluster --name "${CLUSTER_NAME}"
            else
              echo "Kind cluster ${CLUSTER_NAME} not found. Set repository variable 'KIND_CLUSTER' or set CREATE_CLUSTER=true to create it."
              exit 1
            fi
          fi

      - name: Build Docker image
        working-directory: pyapp
        run: |
          docker build -t pyapp:${{ steps.meta.outputs.tag }} .

      - name: Load image into Kind
        run: |
          # Strip 'kind-' prefix for kind commands (which use cluster names, not context names)
          CLUSTER_NAME=${KIND_CLUSTER#kind-}
          kind load docker-image pyapp:${{ steps.meta.outputs.tag }} --name "$CLUSTER_NAME"

      - name: Deploy to Kind
        working-directory: pyapp
        run: |
          helm upgrade --install pyapp ./chart \
            --namespace ${{ steps.meta.outputs.namespace }} \
            --create-namespace \
            --set image.tag=${{ steps.meta.outputs.tag }}
